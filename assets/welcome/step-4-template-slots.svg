<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Set Template Slots</title>
  <desc id="desc">NoteFlow templates tab with slots A to E and treatment note fields.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <rect x="118" y="70" width="1044" height="620" rx="18" fill="#0d1117" stroke="#273244"/>
  <rect x="118" y="70" width="1044" height="78" rx="18" fill="#060a10"/>
  <text x="156" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#58a6ff">NoteFlow Templates</text>
  <rect x="226" y="175" width="828" height="70" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="256" y="219" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#fff">Choose a template slot</text>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="800">
    <rect x="256" y="276" width="74" height="56" rx="10" fill="#14532d" stroke="#22c55e"/><text x="286" y="312" fill="#fff">A</text>
    <rect x="346" y="276" width="74" height="56" rx="10" fill="#0f172a" stroke="#22c55e"/><text x="376" y="312" fill="#22c55e">B</text>
    <rect x="436" y="276" width="74" height="56" rx="10" fill="#0f172a" stroke="#22c55e"/><text x="466" y="312" fill="#22c55e">C</text>
    <rect x="526" y="276" width="74" height="56" rx="10" fill="#0f172a" stroke="#22c55e"/><text x="556" y="312" fill="#22c55e">D</text>
    <rect x="616" y="276" width="74" height="56" rx="10" fill="#0f172a" stroke="#22c55e"/><text x="646" y="312" fill="#22c55e">E</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#c9d7e8">
    <text x="256" y="386">Examination</text><rect x="256" y="402" width="768" height="48" rx="8" fill="#111827" stroke="#334155"/>
    <text x="256" y="488">Symptom</text><rect x="256" y="504" width="768" height="48" rx="8" fill="#111827" stroke="#334155"/>
    <text x="256" y="590">Treatment Area</text><rect x="256" y="606" width="768" height="48" rx="8" fill="#111827" stroke="#334155"/>
  </g>
  <text x="286" y="434" font-family="Consolas, monospace" font-size="19" fill="#e5edf7">ROM assessed, palpation findings noted...</text>
  <text x="286" y="536" font-family="Consolas, monospace" font-size="19" fill="#e5edf7">Muscle tension, tenderness and complaint pattern...</text>
  <text x="286" y="638" font-family="Consolas, monospace" font-size="19" fill="#e5edf7">Upper back, neck, shoulders...</text>
</svg>
