<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Review Privacy Consent</title>
  <desc id="desc">Privacy consent checklist before using NoteFlow.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <rect x="170" y="80" width="940" height="600" rx="22" fill="#f8fafc" stroke="#d7dee9"/>
  <rect x="170" y="80" width="940" height="76" rx="22" fill="#0b73d9"/>
  <text x="236" y="128" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">Privacy notice before first use</text>
  <rect x="236" y="210" width="808" height="310" rx="18" fill="#fff" stroke="#d6e0ec"/>
  <text x="280" y="262" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">NoteFlow needs your consent</text>
  <g font-family="Arial, sans-serif" font-size="23" fill="#243244">
    <text x="316" y="324">Read supported BookRelax page content only when needed.</text>
    <text x="316" y="382">Use templates and body chart selections for note filling.</text>
    <text x="316" y="440">Send license verification to the license service.</text>
  </g>
  <g fill="#16a34a">
    <circle cx="284" cy="315" r="14"/><circle cx="284" cy="373" r="14"/><circle cx="284" cy="431" r="14"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">
    <text x="277" y="323">✓</text><text x="277" y="381">✓</text><text x="277" y="439">✓</text>
  </g>
  <rect x="620" y="560" width="250" height="62" rx="12" fill="#0b73d9"/>
  <text x="674" y="600" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">I understand</text>
  <text x="236" y="590" font-family="Arial, sans-serif" font-size="20" fill="#526173">Review once, then continue setup.</text>
</svg>
